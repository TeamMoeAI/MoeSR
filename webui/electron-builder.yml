appId: moe.sr.desktop
productName: MoeSR

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

extraResources:
  - from: ../runtime
    to: runtime
    filter:
      - "**/*"
  - from: ..
    to: python
    filter:
      - backend_server.py
      - frontend_bridge.py
      - image_utils.py
      - moe_sr.py
      - onnx_infer.py
      - gpu_enum.py
      - gpu_enum.dll
      - app_logging.py
extraFiles:
  - from: ../MoeSRData/models
    to: MoeSRData/models
    filter:
      - "Place models here.txt"

win:
  icon: build/icon.png
  target:
    - zip
